name: ScrapeCast Build

on:
  push:
    branches: [ master ]

# Runs that publish must not overlap: a push from one would reject the
# other's (e.g. the exe built after a merge).
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - uses: szenius/set-timezone@v2.0
        with:
            timezoneLinux: "Europe/Budapest"

      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@9a04e6d73cca37bd455e0608d7e5092f881fd603
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Git Config
        run: |
          git config user.name "ScrapeCast"
          git config user.email "example@example.com"

      - name: Compile
        run: dart compile exe ./bin/scrapecast.dart

      - name: Run
        run: ./bin/scrapecast.exe

      - name: Publish changes
        run: |
          git add docs
          git add data
          git add bin/scrapecast.exe
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "Publish changes"
            git push origin master
          fi